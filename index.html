<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>365days+1 — Salón de Arte</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; cursor: none !important; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1a1a; font-family: "Plus Jakarta Sans", sans-serif; color: #fff; }
    #webgl-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; display: block; }
    
    /* Grano de película */
    .film-grain {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Viñeta */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    }

    /* Overlay de inicio */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1.5s ease;
      pointer-events: auto;
    }
    #start-overlay.hidden { opacity: 0; pointer-events: none; }
    #start-overlay h1 {
      font-size: clamp(3.5rem, 10vw, 7rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #f0ece6 0%, #a09888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 80px rgba(255,255,255,0.08);
      margin-bottom: 2rem;
    }
    #start-btn {
      padding: 1.2rem 3.5rem;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 60px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      cursor: pointer !important;
      transition: all 0.4s ease;
      backdrop-filter: blur(4px);
      font-family: "Plus Jakarta Sans", sans-serif;
      text-transform: uppercase;
    }
    #start-btn:hover { background: #fff; color: #111; transform: scale(1.05); border-color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

    /* Cursor personalizado (solo visible, sin texto) */
    #fluid-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(255,255,255,0.7);
      transition: width 0.3s ease, height 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }
    #fluid-cursor.bubble-mode {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 30px rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
    }
    body.in-info-space #fluid-cursor { background: #111; box-shadow: 0 0 10px rgba(0,0,0,0.3); }

    /* Flechas laterales (solo iconos, sin texto) */
    .nav-arrow-hitbox {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 80px;
      height: 160px;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arrow-left-box { left: 2vw; }
    .arrow-right-box { right: 2vw; }
    .nav-arrow-glyph {
      width: 36px;
      height: 36px;
      stroke: rgba(255,255,255,0.4);
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .nav-arrow-hitbox:hover .nav-arrow-glyph {
      opacity: 0.8;
      transform: scale(1.2);
    }

    /* Panel de información (se mantiene) */
    #info-space {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #f7f6f2;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 5vw, 5rem);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    #info-space.active { opacity: 1; pointer-events: auto; }
    .info-container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: clamp(2rem, 5vw, 5rem);
      align-items: center;
    }
    .info-artwork-box {
      width: 100%;
      max-width: 440px;
      justify-self: center;
      aspect-ratio: 3/4.2;
      background: #0d0d0d;
      padding: 12px;
      border-radius: 4px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.25);
    }
    .info-artwork-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 2px;
    }
    .info-details {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .info-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .info-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #b93a2b;
      border-radius: 50%;
    }
    .info-title {
      font-size: clamp(2rem, 3.2vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: #111;
    }
    .info-date-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 1rem;
      color: #666;
      font-weight: 500;
    }
    .info-desc {
      font-size: clamp(0.95rem, 1.15vw, 1.08rem);
      line-height: 1.65;
      color: #444;
      font-weight: 400;
      max-width: 520px;
      margin-top: 0.5rem;
    }
    .info-specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      border-top: 1px solid rgba(0,0,0,0.1);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
    }
    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .spec-label {
      font-size: 0.72rem;
      font-family: "JetBrains Mono", monospace;
      color: #888;
      text-transform: uppercase;
    }
    .spec-val {
      font-size: 0.92rem;
      font-weight: 600;
      color: #1a1a1a;
    }
    .btn-return-gallery {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1rem;
      background: #1a1a1a;
      color: #fff;
      padding: 0.9rem 1.8rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: transform 0.25s ease, background 0.25s ease;
      align-self: flex-start;
      cursor: pointer !important;
    }
    .btn-return-gallery:hover { background: #000; transform: translateY(-2px); }
    .info-close-btn {
      position: absolute;
      top: 2.5rem;
      right: 3rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer !important;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    .info-close-btn:hover { transform: rotate(90deg) scale(1.1); background: rgba(0,0,0,0.06); }
    .info-close-btn svg { width: 20px; height: 20px; stroke: #1a1a1a; stroke-width: 2; }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div class="film-grain"></div>
  <div class="vignette"></div>

  <div id="start-overlay">
    <h1>365days⁺¹</h1>
    <button id="start-btn">EXPLORAR</button>
  </div>

  <div class="nav-arrow-hitbox arrow-left-box" id="btnPrev">
    <svg class="nav-arrow-glyph" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </div>
  <div class="nav-arrow-hitbox arrow-right-box" id="btnNext">
    <svg class="nav-arrow-glyph" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </div>

  <div id="fluid-cursor"></div>

  <div id="info-space">
    <div class="info-close-btn" id="btnCloseInfo" title="Volver (ESC)">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </div>
    <div class="info-container">
      <div class="info-artwork-box">
        <img class="info-artwork-img" id="infoImg" src="" alt="Obra">
      </div>
      <div class="info-details">
        <div class="info-badge">Sala de Exposición</div>
        <h1 class="info-title" id="infoTitle">Obra #1 — Serie 365days</h1>
        <div class="info-date-tag" id="infoDate">Día 1 / 365 — 01 de Enero, 2024</div>
        <p class="info-desc" id="infoDesc">
          Cada día una obra. Esta es la esencia de 365days: capturar el paso del tiempo a través de la imagen.
        </p>
        <div class="info-specs-grid">
          <div class="spec-item"><span class="spec-label">Técnica</span><span class="spec-val">Pintura Digital</span></div>
          <div class="spec-item"><span class="spec-label">Dimensiones</span><span class="spec-val">1024 × 1440 px</span></div>
          <div class="spec-item"><span class="spec-label">Colección</span><span class="spec-val">365days+1</span></div>
          <div class="spec-item"><span class="spec-label">Artista</span><span class="spec-val">Masayuki Kamimae</span></div>
        </div>
        <button class="btn-return-gallery" id="btnReturn"><span>← Volver a la Sala</span></button>
      </div>
    </div>
  </div>

  <script>
    // ---------- CONFIGURACIÓN ----------
    const TOTAL_DAYS = 365;
    const UNIQUE_IMAGES = 8;
    const GALLERY_RADIUS = 100;
    const FRAME_W = 1.0;
    const FRAME_H = 1.4;
    const FRAME_D = 0.06;

    // ---------- CARGAR IMÁGENES ----------
    const textureCache = [];
    const imageSources = [];

    function createPlaceholderTexture(imgNum) {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1440;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#888';
      ctx.font = 'bold 180px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(imgNum).padStart(2, '0'), cv.width/2, cv.height/2);
      const tex = new THREE.CanvasTexture(cv);
      tex.anisotropy = 16;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = true;
      if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function loadArtworkTexture(imgNum) {
      const tex = createPlaceholderTexture(imgNum);
      const cv = tex.image;
      const exts = ['png', 'jpg', 'jpeg', 'webp'];
      let attempt = 0;
      function tryLoad() {
        if (attempt >= exts.length) {
          imageSources[imgNum] = '';
          return;
        }
        const filename = `imagen${imgNum}.${exts[attempt]}`;
        const img = new Image();
        img.onload = () => {
          const ctx = cv.getContext('2d');
          ctx.clearRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          tex.needsUpdate = true;
          imageSources[imgNum] = filename;
        };
        img.onerror = () => { attempt++; tryLoad(); };
        img.src = filename;
      }
      tryLoad();
      return tex;
    }

    for (let i = 1; i <= UNIQUE_IMAGES; i++) {
      textureCache[i] = loadArtworkTexture(i);
      imageSources[i] = '';
    }

    // Drag & Drop (mantenido para que puedas cambiar imágenes)
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', e => {
      e.preventDefault();
      const files = Array.from(e.dataTransfer.files);
      files.forEach(file => {
        const match = file.name.match(/\d+/);
        if (match) {
          const num = ((parseInt(match[0], 10) - 1) % UNIQUE_IMAGES) + 1;
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            const tex = textureCache[num];
            const cv = tex.image;
            const ctx = cv.getContext('2d');
            ctx.clearRect(0, 0, cv.width, cv.height);
            ctx.drawImage(img, 0, 0, cv.width, cv.height);
            tex.needsUpdate = true;
            imageSources[num] = url;
          };
          img.src = url;
        }
      });
    });

    // ---------- TEXTURAS AUXILIARES ----------
    function createDropShadowTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 30, 256, 256, 250);
      grad.addColorStop(0, 'rgba(0,0,0,0.65)');
      grad.addColorStop(0.4, 'rgba(0,0,0,0.25)');
      grad.addColorStop(0.7, 'rgba(0,0,0,0.05)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      return new THREE.CanvasTexture(cv);
    }

    function createSpotlightTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      const grad = ctx.createRadialGradient(256, 256, 5, 256, 256, 240);
      grad.addColorStop(0, 'rgba(255,255,255,0.55)');
      grad.addColorStop(0.3, 'rgba(255,255,255,0.2)');
      grad.addColorStop(0.65, 'rgba(255,255,255,0.03)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      return new THREE.CanvasTexture(cv);
    }

    function createWoodTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#b8a28c';
      ctx.fillRect(0, 0, c.width, c.height);
      for (let i=0; i<200; i++) {
        const x = Math.random()*c.width, y = Math.random()*c.height;
        ctx.strokeStyle = `rgba(80,60,40,${0.15+Math.random()*0.3})`;
        ctx.lineWidth = 2+Math.random()*8;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.bezierCurveTo(
          x+(Math.random()-0.5)*120, y+(Math.random()-0.5)*120,
          x+(Math.random()-0.5)*120, y+(Math.random()-0.5)*120,
          x+(Math.random()-0.5)*250, y+(Math.random()-0.5)*250
        );
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(12, 12);
      tex.anisotropy = 16;
      return tex;
    }

    // ---------- ESCENA THREE.JS ----------
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2a2a);
    scene.fog = new THREE.FogExp2(0x2a2a2a, 0.0045);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 250);

    // ---------- ILUMINACIÓN CINEMATOGRÁFICA ----------
    const ambLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambLight);

    const mainLight = new THREE.DirectionalLight(0xffeedd, 1.5);
    mainLight.position.set(10, 20, 15);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 4096;
    mainLight.shadow.mapSize.height = 4096;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 120;
    mainLight.shadow.camera.left = -60;
    mainLight.shadow.camera.right = 60;
    mainLight.shadow.camera.top = 60;
    mainLight.shadow.camera.bottom = -60;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x446688, 0.4);
    fillLight.position.set(-15, 10, -20);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffaa66, 0.6);
    rimLight.position.set(-5, 5, 25);
    scene.add(rimLight);

    // ---------- SUELO ----------
    const floorSize = GALLERY_RADIUS + 10;
    const floorGeo = new THREE.PlaneGeometry(floorSize*2, floorSize*2);
    const floorMat = new THREE.MeshStandardMaterial({ map: createWoodTexture(), roughness: 0.7, metalness: 0.05 });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI/2;
    floorMesh.receiveShadow = true;
    floorMesh.position.y = 0;
    scene.add(floorMesh);

    // ---------- PARED ----------
    const wallHeight = 6.0;
    const wallGeo = new THREE.CylinderGeometry(GALLERY_RADIUS, GALLERY_RADIUS, wallHeight, 80, 1, true);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9, side: THREE.DoubleSide });
    const wallMesh = new THREE.Mesh(wallGeo, wallMat);
    wallMesh.position.y = wallHeight/2;
    wallMesh.receiveShadow = true;
    scene.add(wallMesh);

    // ---------- TECHO ----------
    const ceilingGeo = new THREE.CircleGeometry(GALLERY_RADIUS, 80);
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9, side: THREE.BackSide });
    const ceilingMesh = new THREE.Mesh(ceilingGeo, ceilingMat);
    ceilingMesh.rotation.x = -Math.PI/2;
    ceilingMesh.position.y = wallHeight;
    scene.add(ceilingMesh);

    // ---------- CUADROS (365) ----------
    const interactiveMeshes = [];
    const outerGeo = new THREE.BoxGeometry(FRAME_W, FRAME_H, FRAME_D);
    const outerMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.3 });
    const matGeo = new THREE.PlaneGeometry(FRAME_W - 0.05, FRAME_H - 0.05);
    const matMat = new THREE.MeshBasicMaterial({ color: 0xe8e0d8 });
    const canvasGeo = new THREE.PlaneGeometry(FRAME_W - 0.14, FRAME_H - 0.14);
    const dropShadowTex = createDropShadowTexture();
    const spotlightTex = createSpotlightTexture();
    const shadowGeo = new THREE.PlaneGeometry(FRAME_W * 1.6, FRAME_H * 1.6);
    const shadowMat = new THREE.MeshBasicMaterial({ map: dropShadowTex, transparent: true, opacity: 0.4, depthWrite: false });
    const spotHaloGeo = new THREE.PlaneGeometry(FRAME_W * 1.4, FRAME_W * 1.4);
    const spotHaloMat = new THREE.MeshBasicMaterial({ map: spotlightTex, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false });

    const paintingY = 1.6;

    for (let i = 0; i < TOTAL_DAYS; i++) {
      const imgNum = (i % UNIQUE_IMAGES) + 1;
      const angle = (i / TOTAL_DAYS) * Math.PI * 2;
      const container = new THREE.Group();
      const x = Math.sin(angle) * (GALLERY_RADIUS - 0.15);
      const z = Math.cos(angle) * (GALLERY_RADIUS - 0.15);
      container.position.set(x, paintingY, z);
      container.rotation.y = angle + Math.PI;

      const shadow = new THREE.Mesh(shadowGeo, shadowMat);
      shadow.position.set(0, 0, -0.02);
      container.add(shadow);

      const halo = new THREE.Mesh(spotHaloGeo, spotHaloMat);
      halo.position.set(0, FRAME_H/2 + 0.15, -0.02);
      container.add(halo);

      const frame = new THREE.Mesh(outerGeo, outerMat);
      frame.castShadow = true;
      container.add(frame);

      const pp = new THREE.Mesh(matGeo, matMat);
      pp.position.z = FRAME_D/2 + 0.001;
      container.add(pp);

      const canvasMat = new THREE.MeshStandardMaterial({ map: textureCache[imgNum], roughness: 0.5, metalness: 0.05 });
      const canvasMesh = new THREE.Mesh(canvasGeo, canvasMat);
      canvasMesh.position.z = FRAME_D/2 + 0.004;
      canvasMesh.userData = { index: i, imgNum: imgNum };
      container.add(canvasMesh);
      interactiveMeshes.push(canvasMesh);

      scene.add(container);
    }

    // ---------- CÁMARA Y CONTROLES ----------
    const player = { pos: new THREE.Vector3(0, 1.6, 0), vel: new THREE.Vector3(), yaw: 0, pitch: 0, walkTime: 0 };
    let targetYaw = 0, targetPitch = 0;
    let isDragging = false, startX = 0, startY = 0;
    let inInfoSpace = false;
    let startAnimationDone = false;
    const keys = { w: false, a: false, s: false, d: false };

    // Posición final: frente al cuadro #1, a 2.5 m, con un ligero pitch para dramatismo
    const finalCamPos = new THREE.Vector3(0, 1.7, GALLERY_RADIUS - 2.5);
    const finalLookAt = new THREE.Vector3(0, 1.6, GALLERY_RADIUS);

    document.getElementById('start-btn').addEventListener('click', () => {
      const overlay = document.getElementById('start-overlay');
      overlay.classList.add('hidden');
      camera.position.set(0, 1.6, 0);
      camera.lookAt(0, 1.6, 0);
      targetYaw = 0;
      targetPitch = 0;
      player.yaw = 0;
      player.pitch = 0;

      gsap.to(camera.position, {
        x: finalCamPos.x,
        y: finalCamPos.y,
        z: finalCamPos.z,
        duration: 2.8,
        ease: "power3.inOut",
        onUpdate: () => {
          camera.lookAt(finalLookAt);
        },
        onComplete: () => {
          startAnimationDone = true;
          player.pos.copy(finalCamPos);
          player.pos.y = 1.7;
          player.yaw = Math.PI;
          player.pitch = -0.08; // ligera inclinación hacia abajo
          targetYaw = player.yaw;
          targetPitch = player.pitch;
          camera.position.copy(player.pos);
          camera.rotation.set(0,0,0);
          camera.rotation.y = player.yaw;
          camera.rotation.x = player.pitch;
        }
      });
    });

    // Controles
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (k === 's' || e.key === 'ArrowDown') keys.s = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
      if (e.key === 'Escape') closeInfoSpace();
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (k === 's' || e.key === 'ArrowDown') keys.s = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
    });

    window.addEventListener('pointerdown', e => {
      if (inInfoSpace || e.target.closest('.nav-arrow-hitbox') || e.target.closest('#info-space')) return;
      isDragging = true;
      startX = e.clientX; startY = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      mouseX = e.clientX; mouseY = e.clientY;
      if (!isDragging || inInfoSpace || !startAnimationDone) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      targetYaw -= dx * 0.0035;
      targetPitch -= dy * 0.0028;
      targetPitch = Math.max(-1.2, Math.min(1.2, targetPitch));
      startX = e.clientX; startY = e.clientY;
    });
    window.addEventListener('pointerup', () => { isDragging = false; });

    document.getElementById('btnPrev').addEventListener('click', e => { e.stopPropagation(); if (startAnimationDone) targetYaw += Math.PI/4; });
    document.getElementById('btnNext').addEventListener('click', e => { e.stopPropagation(); if (startAnimationDone) targetYaw -= Math.PI/4; });
    window.addEventListener('wheel', e => { if (startAnimationDone && !inInfoSpace) targetYaw -= e.deltaY * 0.0012; }, { passive: true });

    // ---------- RAYCASTER E INFO ----------
    const raycaster = new THREE.Raycaster();
    const mouseVec = new THREE.Vector2();
    const infoSpace = document.getElementById('info-space');
    const infoImg = document.getElementById('infoImg');
    const infoTitle = document.getElementById('infoTitle');
    const infoDate = document.getElementById('infoDate');

    window.addEventListener('click', e => {
      if (inInfoSpace || e.target.closest('.nav-arrow-hitbox') || isDragging || !startAnimationDone) return;
      mouseVec.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseVec.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouseVec, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);
      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        openInfoSpace(data.index, data.imgNum, intersects[0].object);
      }
    });

    function openInfoSpace(index, imgNum, targetMesh) {
      if (inInfoSpace) return;
      inInfoSpace = true;
      document.body.classList.add('in-info-space');
      infoImg.src = imageSources[imgNum] || '';
      const dayNum = index + 1;
      infoTitle.textContent = `Obra #${dayNum} — Serie 365days`;
      infoDate.textContent = `Día ${dayNum} de ${TOTAL_DAYS} | ${get2024DateString(index)}`;

      const targetPos = new THREE.Vector3();
      targetMesh.getWorldPosition(targetPos);
      const camTargetPos = targetPos.clone().add(targetMesh.getWorldDirection(new THREE.Vector3()).multiplyScalar(2.0));
      gsap.to(camera.position, { x: camTargetPos.x, y: camTargetPos.y, z: camTargetPos.z, duration: 0.9, ease: "power2.inOut" });
      setTimeout(() => { infoSpace.classList.add('active'); }, 450);
    }

    function closeInfoSpace() {
      if (!inInfoSpace) return;
      infoSpace.classList.remove('active');
      document.body.classList.remove('in-info-space');
      gsap.to(camera.position, { x: player.pos.x, y: player.pos.y, z: player.pos.z, duration: 0.8, ease: "power3.out", onComplete: () => { inInfoSpace = false; } });
    }
    document.getElementById('btnCloseInfo').addEventListener('click', closeInfoSpace);
    document.getElementById('btnReturn').addEventListener('click', closeInfoSpace);

    // ---------- HUD (oculto) ----------
    function get2024DateString(dayIndex) { const d = new Date(2024,0,1); d.setDate(d.getDate()+dayIndex); return `${d.getDate()} de ${d.toLocaleString('es-ES',{month:'short'})}`; }

    // ---------- CURSOR ----------
    const cursor = document.getElementById('fluid-cursor');
    let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
    let cursorX = mouseX, cursorY = mouseY;
    const btnPrev = document.getElementById('btnPrev'), btnNext = document.getElementById('btnNext');
    btnPrev.addEventListener('mouseenter', () => cursor.classList.add('bubble-mode'));
    btnPrev.addEventListener('mouseleave', () => cursor.classList.remove('bubble-mode'));
    btnNext.addEventListener('mouseenter', () => cursor.classList.add('bubble-mode'));
    btnNext.addEventListener('mouseleave', () => cursor.classList.remove('bubble-mode'));

    // ---------- LOOP PRINCIPAL ----------
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      cursorX += (mouseX - cursorX) * 0.22;
      cursorY += (mouseY - cursorY) * 0.22;
      cursor.style.left = `${cursorX}px`;
      cursor.style.top = `${cursorY}px`;

      if (startAnimationDone && !inInfoSpace) {
        player.yaw += (targetYaw - player.yaw) * 0.1;
        player.pitch += (targetPitch - player.pitch) * 0.1;

        const moveDir = new THREE.Vector3();
        if (keys.w) moveDir.z -= 1;
        if (keys.s) moveDir.z += 1;
        if (keys.a) moveDir.x -= 1;
        if (keys.d) moveDir.x += 1;
        if (moveDir.lengthSq() > 0) {
          moveDir.normalize();
          moveDir.applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);
          const speed = 6.0;
          player.vel.x += moveDir.x * speed * dt * 8.0;
          player.vel.z += moveDir.z * speed * dt * 8.0;
          player.walkTime += dt * 9.0;
          player.pos.y = 1.6 + Math.sin(player.walkTime) * 0.025;
        } else {
          player.pos.y += (1.6 - player.pos.y) * 0.1;
        }
        player.vel.x *= 0.86;
        player.vel.z *= 0.86;
        player.pos.x += player.vel.x * dt;
        player.pos.z += player.vel.z * dt;

        const maxDist = GALLERY_RADIUS - 2.0;
        const dist = Math.sqrt(player.pos.x*player.pos.x + player.pos.z*player.pos.z);
        if (dist > maxDist) { player.pos.x = (player.pos.x/dist)*maxDist; player.pos.z = (player.pos.z/dist)*maxDist; }

        camera.position.copy(player.pos);
        camera.rotation.set(0,0,0);
        camera.rotation.y = player.yaw;
        camera.rotation.x = player.pitch;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    if (!startAnimationDone) {
      camera.position.set(0, 1.6, 0);
      camera.lookAt(0, 1.6, 0);
    }
  </script>
</body>
</html>
